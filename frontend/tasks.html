<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">📋 TaskFlow</div>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="projects.html" class="nav-item">
            <i class="fas fa-folder"></i> Proyectos
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i> Perfil
        </a>
        <hr />
        <a href="#" class="nav-item" id="logoutBtn" style="color: #EF4444;">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold">
                <i class="fas fa-tasks"></i> 
                <span id="projectName">Tareas del Proyecto</span>
            </h4>
            <div>
                <a href="projects.html" class="btn btn-secondary me-2">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
                <button class="btn btn-primary-custom" onclick="openCreateTaskModal()">
                    <i class="fas fa-plus"></i> Nueva Tarea
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <select id="filterStatus" class="form-control-custom">
                    <option value="all">Todos los estados</option>
                    <option value="todo">📋 Por Hacer</option>
                    <option value="in_progress">🔄 En Progreso</option>
                    <option value="review">👀 En Revisión</option>
                    <option value="done">✅ Completado</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="filterPriority" class="form-control-custom">
                    <option value="all">Todas las prioridades</option>
                    <option value="high">🔴 Alta</option>
                    <option value="medium">🟡 Media</option>
                    <option value="low">🟢 Baja</option>
                </select>
            </div>
        </div>

        <!-- Lista de tareas -->
        <div id="tasksList">
            <p class="text-muted text-center py-3">Cargando tareas...</p>
        </div>
    </div>

    <!-- Modal de tarea -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">Nueva Tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="taskForm">
                    <div class="modal-body">
                        <input type="hidden" id="taskId" />
                        <div class="mb-3">
                            <label class="form-label-custom">Título *</label>
                            <input type="text" id="taskTitle" class="form-control-custom" placeholder="Título de la tarea" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Descripción</label>
                            <textarea id="taskDescription" class="form-control-custom" rows="2" placeholder="Descripción de la tarea"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label-custom">Prioridad</label>
                                    <select id="taskPriority" class="form-control-custom">
                                        <option value="high">🔴 Alta</option>
                                        <option value="medium" selected>🟡 Media</option>
                                        <option value="low">🟢 Baja</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label-custom">Fecha Límite</label>
                                    <input type="date" id="taskDueDate" class="form-control-custom" />
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Estado</label>
                            <select id="taskStatus" class="form-control-custom">
                                <option value="todo">📋 Por Hacer</option>
                                <option value="in_progress">🔄 En Progreso</option>
                                <option value="review">👀 En Revisión</option>
                                <option value="done">✅ Completado</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary-custom">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
