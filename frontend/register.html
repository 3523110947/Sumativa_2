<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at top left, #1a1a2e, #0f0f1a);
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease-out;
        }

        .login-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card .logo .icon {
            font-size: 40px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .login-card .logo h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #e8e8f0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .login-card .logo p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 2px;
        }

        .login-card .form-group {
            margin-bottom: 16px;
        }

        .login-card .form-group label {
            color: #94a3b8;
            font-weight: 500;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }

        .login-card .form-group .input-wrapper {
            position: relative;
        }

        .login-card .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        .login-card .form-group input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e8e8f0;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .login-card .form-group input::placeholder {
            color: #64748b;
        }

        .login-card .form-group input:focus {
            outline: none;
            border-color: #7c3aed;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.35);
        }

        .login-card .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .login-card .footer-links {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .login-card .footer-links a {
            color: #a78bfa;
            font-weight: 500;
            transition: color 0.3s;
        }

        .login-card .footer-links a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        .login-card .alert {
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }

        .login-card .alert.show {
            display: block;
            animation: fadeInUp 0.3s ease-out;
        }

        .login-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .login-decoration.d1 {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            top: -100px;
            right: -100px;
        }

        .login-decoration.d2 {
            width: 200px;
            height: 200px;
            background: #4f46e5;
            bottom: -50px;
            left: -50px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .login-card .logo h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-decoration d1"></div>
    <div class="login-decoration d2"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="icon"><i class="fas fa-user-plus"></i></div>
                <h2>Crear Cuenta</h2>
                <p>Comienza a gestionar tus proyectos</p>
            </div>

            <div id="registerError" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="Juan Pérez" required />
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required />
                    </div>
                </div>

                <button type="submit" class="btn-login" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Registrarse
                </button>
            </form>

            <div class="footer-links">
                ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
