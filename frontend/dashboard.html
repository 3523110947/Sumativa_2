<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">📋 TaskFlow</div>
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="projects.html" class="nav-item">
            <i class="fas fa-folder"></i> Proyectos
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i> Perfil
        </a>
        <hr />
        <a href="#" class="nav-item" id="logoutBtn" style="color: #EF4444;">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold">Dashboard</h4>
            <div class="user-info">
                <span class="user-name-display">Usuario</span>
                <span class="user-avatar avatar">U</span>
            </div>
        </div>

        <!-- Tarjetas de estadísticas -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card-custom text-center">
                    <h5 class="text-muted small">Total Proyectos</h5>
                    <h3 id="totalProjects" class="fw-bold text-primary-custom">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-custom text-center">
                    <h5 class="text-muted small">Activos</h5>
                    <h3 id="activeProjects" class="fw-bold text-success">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-custom text-center">
                    <h5 class="text-muted small">Completados</h5>
                    <h3 id="completedProjects" class="fw-bold text-primary">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-custom text-center">
                    <h5 class="text-muted small">Tareas Pendientes</h5>
                    <h3 id="pendingTasks" class="fw-bold text-warning">0</h3>
                </div>
            </div>
        </div>

        <!-- Proyectos y tareas recientes -->
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card-custom">
                    <h6 class="fw-bold mb-3">📁 Proyectos Recientes</h6>
                    <div id="recentProjects">
                        <p class="text-muted text-center py-3 small">Cargando...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card-custom">
                    <h6 class="fw-bold mb-3">✅ Tareas Recientes</h6>
                    <div id="recentTasks">
                        <p class="text-muted text-center py-3 small">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
