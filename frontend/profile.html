<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">📋 TaskFlow</div>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="projects.html" class="nav-item">
            <i class="fas fa-folder"></i> Proyectos
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-user"></i> Perfil
        </a>
        <hr />
        <a href="#" class="nav-item" id="logoutBtn" style="color: #EF4444;">
            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
        </a>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold mb-4">Mi Perfil</h4>

        <div class="row g-3">
            <!-- Información personal -->
            <div class="col-md-6">
                <div class="card-custom">
                    <h6 class="fw-bold mb-3"><i class="fas fa-user-edit"></i> Información Personal</h6>
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label-custom">Nombre Completo</label>
                            <input type="text" id="profileName" class="form-control-custom" placeholder="Tu nombre" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Correo Electrónico</label>
                            <input type="email" id="profileEmail" class="form-control-custom" disabled />
                        </div>
                        <button type="submit" class="btn btn-primary-custom">Guardar Cambios</button>
                    </form>
                </div>
            </div>

            <!-- Cambiar contraseña -->
            <div class="col-md-6">
                <div class="card-custom">
                    <h6 class="fw-bold mb-3"><i class="fas fa-lock"></i> Cambiar Contraseña</h6>
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label class="form-label-custom">Contraseña Actual</label>
                            <input type="password" id="currentPassword" class="form-control-custom" placeholder="••••••••" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Nueva Contraseña</label>
                            <input type="password" id="newPassword" class="form-control-custom" placeholder="Mínimo 6 caracteres" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Confirmar Nueva Contraseña</label>
                            <input type="password" id="confirmPassword" class="form-control-custom" placeholder="••••••••" required />
                        </div>
                        <button type="submit" class="btn btn-primary-custom">Cambiar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
